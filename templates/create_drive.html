<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        #form-body{
            height: auto;
            width: 700px;
            margin-top: 10px ;
        }
        body {
            background-color: rgb(232, 224, 238);
        }
    .navbar, .navbar-brand, .nav-link {
        color: white !important;
        background-color: rgb(152, 101, 152)
    }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Placement Portal Application</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    </div>
                </div>
            </nav>
            <div id="form-body">
                <h1 class="heading">Create a Drive</h1>
                <form action="/create_drive/{{this_user.uid}}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Drive Name</label>
                    <input type="text" class="form-control" id="name" name="drive_name">
                </div>
                <div class="mb-3">
                    <label for="title" class="form-label">Job Title</label>
                    <input type="text" class="form-control" id="title" name="job_title">
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">Job Description</label>
                    <input type="text" class="form-control" id="desc" name="job_description">
                </div>
                <div class="mb-3">
                    <label for="eligibility" class="form-label">Eligibility Criteria</label>
                    <input type="text" class="form-control" id="eligibility" name="eligibility_criteria">
                </div>
                <div class="mb-3">
                    <label for="sal" class="form-label">Package (CTC)</label>
                    <input type="text" class="form-control" id="sal" name="salary">
                </div>
                <div class="mb-3">
                    <label for="loc" class="form-label">Location</label>
                    <input type="text" class="form-control" id="loc" name="location">
                </div>
                <div class="mb-3">
                    <label for="type" class="form-label">Interview Type</label>
                    <input type="text" class="form-control" id="type" name="interview_type">
                </div>
                <div class="mb-3">
                    <label for="deadline" class="form-label">Application Deadline</label>
                    <input type="date" class="form-control" id="deadline" name="application_deadline">
                </div>
                <div class="text-end">
                    <input type="submit" class="btn btn-outline-success" value="Save">
                </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
