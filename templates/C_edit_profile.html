<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Edit Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        #form-body{
            height: 660px;
            width: 700px;
            margin-top: 50px ;
        }
        body {
            background-color: rgb(232, 224, 238);
        }
    .navbar, .navbar-brand, .nav-link {
        color: white !important;
        background-color: rgb(152, 101, 152)
    }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Placement Portal Application</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    </div>
                </div>
            </nav>
            <div id="form-body">
                <h1 class="heading">Edit Profile</h1>
                <form action="/C_edit/{{this_user.uid}}" method="post">
                <div class="mb-3">
                    <label for="uname" class="form-label">Company Username</label>
                    <input class="form-control" type="text" value="{{this_user.username}}" aria-label="Disabled input example" disabled readonly>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Company Name</label>
                    <input type="text" class="form-control" id="name" name="company_name">
                </div>
                <div class="mb-3">
                    <label for="abt" class="form-label">Company About</label>
                    <input type="text" class="form-control" id="abt" name="company_about">
                </div>
                <div class="mb-3">
                    <label for="loc" class="form-label">Headquarters</label>
                    <input type="text" class="form-control" id="loc" name="location">
                </div>
                <div class="mb-3">
                    <label for="hr" class="form-label">HR Contact</label>
                    <input type="text" class="form-control" id="hr" name="hr_contact">
                </div>
                <div class="mb-3">
                    <label for="url" class="form-label">Website URL</label>
                    <input type="text" class="form-control" id="url" name="website_url">
                </div>
                <div class="text-end">
                    <input type="submit" class="btn btn-outline-success" value="Save">
                </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
