<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Overview</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
    .navbar, .navbar-brand, .nav-link {
        color: white !important;
        background-color: rgb(152, 101, 152)
    }
</style>
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">{{this_company.cname}}</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/company_history/{{this_company.cid}}">History</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/login">Logout</a>
                        </li>
                    </ul>
                    </div>
                </div>
            </nav>
            <div id="content">
                <h4 class="heading">Overview</h4>
                <div class="card">
                    <div class="card-body">
                        {{this_company.cabout}}
                    </div>
                </div><br>
                <h4 class="heading"><b>Website:</b> <a href="{{this_company.c_website}}" target="_blank">{{this_company.c_website}}</a></h4>
                <h3 class="headings my-4">Current Drives</h3>
                <div id="cards" class="table" style="max-height:200px;overflow-y: scroll;">
                    <table class="table border">
                        <thead>
                            <tr>
                            <th scope="col" class="text-center">Drive Id</th>
                            <th scope="col" class="text-center">Drive Name</th>
                            <th scope="col" class="text-center">Job Title</th>
                            <th scope="col" class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for drive in all_drives %}
                            <tr>
                            <th scope="row" class="text-center">{{drive.did}}</th>
                            <td class="text-center">{{drive.dname}}</td>
                            <td class="text-center">{{drive.job_title}}</td>
                            <td  class="d-flex justify-content-center">
                                <a href="/view_drive/{{drive.did}}" class="btn btn-outline-primary">View Details</a>
                            </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
