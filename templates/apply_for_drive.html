<!DOCTYPE html>
<html lang="en">
<head>
    <title>Apply For Drive</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        #form-body{
            height: auto;
            width: 600px;
            margin-top: 10px ;
        }
        body {
            background-color: rgb(232, 224, 238);
        }
    .navbar, .navbar-brand, .nav-link {
        color: white !important;
        background-color: rgb(152, 101, 152)
    }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas" class="overflow-auto">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Placement Portal Application</a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    </div>
                </div>
            </nav>
            <div id="form-body">
                <h1 class="heading">Apply For Drive</h1>
                <form action="/apply/{{this_drive.did}}/{{this_drive.interview_type}}" method="post">
                <div class="mb-3">
                    <label for="did" class="form-label">Drive Id</label>
                    <input type="text" class="form-control" value= "{{this_drive.did}}" aria-label="Disabled input example" disabled readonly>
                </div>
                <div class="mb-3">
                    <label for="type" class="form-label">Interview Type</label>
                    <input type="text" class="form-control" value= "{{this_drive.interview_type}}" aria-label="Disabled input example" disabled readonly>
                </div>
                <div class="mb-3">
                    <label for="sid" class="form-label">Student Id</label>
                    <input type="text" class="form-control" id="sid" name="student_id">
                </div>
                <div class="mb-3">
                    <label for="gpa" class="form-label">GPA (Out of 10)</label>
                    <input type="number" step="0.01" class="form-control" id="gpa" name="gpa">
                </div>
                <div class="mb-3">
                    <label for="yog" class="form-label">Year of Graduation</label>
                    <input type="number" class="form-control" id="yog" name="year_of_graduation">
                </div>
                <div class="mb-3">
                    <label for="app_date" class="form-label">Application Date</label>
                    <input type="date" class="form-control" id="app_date" name="application_date">
                </div>
                <div class="mb-3">
                    <label for="resume" class="form-label">Resume / CV (paste the Google drive link)</label>
                    <input type="text" class="form-control" id="resume" name="resume">
                </div>
                <div class="text-end">
                    <input type="submit" class="btn btn-outline-success" value="Apply">
                </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
